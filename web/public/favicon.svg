<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rayshio">
  <!--
    Theme-inverting. An SVG favicon carries its own stylesheet and browsers
    honour prefers-color-scheme inside it, so one file covers both themes —
    a dark-on-light mark would otherwise disappear into a dark browser tab.

    The shape is the wordmark's badge: the ink square with the R knocked out,
    so the tab icon and the in-app lockup are recognisably the same mark.
  -->
  <style>
    .plate { fill: #1c1c20; }
    .glyph { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f4f4f5; }
      .glyph { fill: #141416; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14" />
  <text
    class="glyph"
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="38"
    font-weight="600"
  >R</text>
</svg>
